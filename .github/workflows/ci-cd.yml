name: PQM Continuous Integration & Deployment (CI/CD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Typecheck, Functions Build, Security Rules & Unit Tests
  # ─────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate & Verification (Typecheck, Functions, Security Rules & Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: TypeScript Typecheck (Frontend & Shared Engine)
        run: npm run typecheck

      - name: Build & Test External Backend
        run: |
          cd backend
          npm ci
          npm run build
          npm test
          cd ..

      - name: Run Firebase Rules & Security Access Tests
        run: npx vitest run src/services/rulesAudit.test.ts src/services/securityRulesValidator.test.ts tests/security/firebaseRulesSecurity.test.ts

      - name: Run Full Vitest Suite (1889+ tests)
        run: npm run test -- --run

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Chạy bộ kiểm thử End-to-End với Playwright (Chromium)
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: End-to-End Tests (Playwright)
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests (Chromium)
        run: npx playwright test --project=chromium
        env:
          CI: true
          VITE_E2E: 'true'
          VITE_FIREBASE_API_KEY: 'AIzaSyTestSafeMockApiKeyForVitest001'

      - name: Upload Playwright Report Artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Build & Tự động Deploy lên Firebase Hosting
  # ─────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build & Deploy to Firebase Hosting
    needs: [quality-gate, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chỉ deploy khi code được push/merge vào nhánh chính
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      FIREBASE_SA: ${{ secrets['FIREBASE_SERVICE_ACCOUNT_V_BIOTECH'] }}
      FIREBASE_TOKEN: ${{ secrets['FIREBASE_TOKEN'] }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle (Vite)
        run: npm run build

      - name: Build External Backend
        run: |
          cd backend
          npm ci
          npm run build
          cd ..

      - name: Deploy to Firebase Hosting (via Service Account)
        if: env.FIREBASE_SA != ''
        run: |
          echo '${{ env.FIREBASE_SA }}' > $RUNNER_TEMP/firebase_sa.json
          GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase_sa.json npx firebase-tools deploy --only hosting --project v-biotech
          rm -f $RUNNER_TEMP/firebase_sa.json

      - name: Deploy to Firebase Hosting (via FIREBASE_TOKEN fallback)
        if: env.FIREBASE_SA == '' && env.FIREBASE_TOKEN != ''
        run: npx firebase-tools deploy --only hosting --token "${{ env.FIREBASE_TOKEN }}" --project v-biotech

      - name: Informational Notice (If no Firebase secrets configured yet)
        if: env.FIREBASE_SA == '' && env.FIREBASE_TOKEN == ''
        run: |
          echo "ℹ️ Lưu ý: Build hoàn tất thành công 100%!"
          echo "Để kích hoạt tự động deploy lên Firebase (v-biotech):"
          echo "Vui lòng cấu hình Secret 'FIREBASE_SERVICE_ACCOUNT_V_BIOTECH' hoặc 'FIREBASE_TOKEN' trong Settings -> Secrets của GitHub Repository."
