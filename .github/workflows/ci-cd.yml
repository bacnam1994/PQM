name: PQM Continuous Integration & Deployment (CI/CD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Typecheck, Backend Build/Test, Security Rules & Vitest
  # ─────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate & Verification (Typecheck, Backend, Rules & Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 1. Root Dependencies (npm ci)
        run: npm ci

      - name: 2. Frontend & Shared Engine Typecheck
        run: npm run typecheck

      - name: 3. Backend Dependencies (npm ci & build shared packages)
        run: |
          cd packages/release-engine
          npm run build
          cd ../../backend
          npm ci
          cd ..

      - name: 4. Backend Typecheck
        run: |
          cd backend
          npm run typecheck
          cd ..

      - name: 5. Backend Build
        run: |
          cd backend
          npm run build
          cd ..

      - name: 6. Backend Unit & Integration Tests
        run: |
          cd backend
          npm test
          cd ..
        env:
          NODE_ENV: test
          CI: true

      - name: 7. Firebase Security Rules Tests
        run: npx vitest run src/services/rulesAudit.test.ts src/services/securityRulesValidator.test.ts tests/security/firebaseRulesSecurity.test.ts

      - name: 8. Full Vitest Test Suite (1889+ tests)
        run: npm run test -- --run

  # ─────────────────────────────────────────────────────────────
  # JOB 2: End-to-End Tests with Playwright (Chromium)
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: 9. Playwright End-to-End Tests
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests (Chromium)
        run: npx playwright test --project=chromium
        env:
          CI: true
          VITE_E2E: 'true'
          VITE_FIREBASE_API_KEY: 'AIzaSyTestSafeMockApiKeyForVitest001'

      - name: Upload Playwright Report Artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Production Build, Backend Deploy & Firebase Hosting
  # ─────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Production Build, Backend Deploy & Hosting Deploy
    needs: [quality-gate, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only deploy on push to main or master
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      FIREBASE_SA: ${{ secrets['FIREBASE_SERVICE_ACCOUNT_V_BIOTECH'] }}
      FIREBASE_TOKEN: ${{ secrets['FIREBASE_TOKEN'] }}
      VITE_BACKEND_API_URL: ${{ secrets['VITE_BACKEND_API_URL'] || 'https://pqm-backend.onrender.com' }}
      BACKEND_DEPLOY_HOOK_URL: ${{ secrets['BACKEND_DEPLOY_HOOK_URL'] }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 11. Verify VITE_BACKEND_API_URL (Production Fail-Fast Guard)
        run: |
          if [ -z "$VITE_BACKEND_API_URL" ]; then
            echo "::error::CRITICAL: VITE_BACKEND_API_URL is missing. Production build forbidden without backend API URL."
            exit 1
          fi
          echo "Verified VITE_BACKEND_API_URL: $VITE_BACKEND_API_URL"

      - name: 10. Build Frontend Production Bundle (Vite)
        run: npm run build
        env:
          VITE_BACKEND_API_URL: ${{ env.VITE_BACKEND_API_URL }}

      - name: 11. Secret Scan Guard (Verify frontend bundle contains NO API keys)
        run: |
          if grep -rn "AIzaSy" dist/ 2>/dev/null; then
            echo "::error::CRITICAL SECURITY BREACH: Google API Key pattern detected in dist/ bundle!"
            exit 1
          fi
          echo "Verified: Frontend bundle is 100% clean of Google API secrets."

      - name: Build External Backend Artifacts
        run: |
          cd backend
          npm ci
          npm run build
          cd ..

      - name: 12 & 13. Deploy Backend & Verify GET /health
        run: |
          if [ -n "$BACKEND_DEPLOY_HOOK_URL" ]; then
            echo "Deploying External Backend via Deploy Hook..."
            curl -fsS -X POST "$BACKEND_DEPLOY_HOOK_URL"
            echo "Waiting for Backend Health Check at $VITE_BACKEND_API_URL/health..."
            HEALTHY=false
            for i in $(seq 1 24); do
              RESPONSE=$(curl -fsS --max-time 10 "$VITE_BACKEND_API_URL/health" 2>/dev/null || echo "")
              if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
                echo "External Backend is healthy: $RESPONSE"
                HEALTHY=true
                break
              fi
              echo "Attempt $i: Backend warming up, retrying in 5s..."
              sleep 5
            done
            if [ "$HEALTHY" != "true" ]; then
              echo "::error::Backend health check failed after deploy."
              exit 1
            fi
          else
            echo "No BACKEND_DEPLOY_HOOK_URL secret found. Verifying local compiled backend health..."
            cd backend
            PORT=4000 node dist/index.js &
            BACKEND_PID=$!
            sleep 3
            HEALTH=$(curl -fsS http://localhost:4000/health)
            AI_HEALTH=$(curl -fsS http://localhost:4000/api/ai/health)
            kill $BACKEND_PID
            if ! echo "$HEALTH" | grep -q '"status":"healthy"'; then
              echo "::error::Compiled backend health check failed."
              exit 1
            fi
            if ! echo "$AI_HEALTH" | grep -q '"service":"pqm-ai-backend"'; then
              echo "::error::Compiled backend AI health check failed."
              exit 1
            fi
            echo "Compiled backend verified healthy: $HEALTH"
            echo "Compiled backend AI verified healthy: $AI_HEALTH"
            cd ..
          fi

      - name: 14. Deploy to Firebase Hosting (STRICTLY --only hosting, zero functions)
        if: env.FIREBASE_SA != ''
        run: |
          echo '${{ env.FIREBASE_SA }}' > $RUNNER_TEMP/firebase_sa.json
          GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase_sa.json npx firebase-tools deploy --only hosting --project v-biotech
          rm -f $RUNNER_TEMP/firebase_sa.json

      - name: 14. Deploy to Firebase Hosting (via FIREBASE_TOKEN fallback)
        if: env.FIREBASE_SA == '' && env.FIREBASE_TOKEN != ''
        run: npx firebase-tools deploy --only hosting --token "${{ env.FIREBASE_TOKEN }}" --project v-biotech

      - name: 15. Production Smoke Test (Firebase Hosting)
        if: env.FIREBASE_SA != '' || env.FIREBASE_TOKEN != ''
        run: |
          echo "Verifying production Firebase Hosting endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://v-biotech.web.app)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Production Firebase Hosting is healthy (HTTP $STATUS)"
          else
            echo "::warning::Production Hosting returned HTTP $STATUS (CDN may need propagation)"
          fi

      - name: Informational Notice (If no Firebase secrets configured yet)
        if: env.FIREBASE_SA == '' && env.FIREBASE_TOKEN == ''
        run: |
          echo "ℹ️ Lưu ý: Build hoàn tất thành công 100%!"
          echo "Để kích hoạt tự động deploy lên Firebase (v-biotech):"
          echo "Vui lòng cấu hình Secret 'FIREBASE_SERVICE_ACCOUNT_V_BIOTECH' hoặc 'FIREBASE_TOKEN' trong Settings -> Secrets của GitHub Repository."
