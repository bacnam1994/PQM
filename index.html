<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b">
    <link rel="icon" type="image/png" href="/logo-mark.png">
    <link rel="apple-touch-icon" href="/logo-mark.png">
    <title>V-Biotech | Quality Management System</title>

    <!-- Early synchronous theme hydration to prevent FOUC (Modern Web Guidance: dark-mode) -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('pqm_theme') || localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Outfit, Inter, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Google Identity Services SDK for Google Drive Integration -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- SPA redirect handler for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <script>
      // Giải pháp khẩn cấp gỡ bỏ Service Worker cũ của PWA tránh kẹt cache trên shared host
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister().then(function(success) {
              if (success) console.log('Đã giải phóng Service Worker cũ thành công.');
            });
          }
        }).catch(function(err) {
          console.warn('Lỗi khi quét Service Worker:', err);
        });
      }
    </script>

    <style>
        :root {
            color-scheme: light;
        }
        html.dark {
            color-scheme: dark;
        }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f8fafc;
            color: #0f172a; 
            -webkit-font-smoothing: antialiased;
        }
        html.dark body {
            background-color: #09090b;
            color: #f4f4f5;
        }
        #app-loader {
            position: fixed; inset: 0; background: #f8fafc;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 99999;
        }
        html.dark #app-loader {
            background: #09090b;
        }
        .loader-spinner {
            width: 32px; height: 32px; border: 2px solid #e2e8f0;
            border-top: 2px solid #059669; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        html.dark .loader-spinner {
            border: 2px solid #27272a;
            border-top: 2px solid #10b981;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app-loader">
        <img src="/logo.png" alt="V-Biotech" width="72" height="60" fetchpriority="high" style="width: 72px; height: auto; margin-bottom: 16px; object-fit: contain;" />
        <div class="loader-spinner"></div>
        <p style="margin-top: 16px; font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 2px;">V-Biotech Systems</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
