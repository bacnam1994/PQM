<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#008037">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>V-Biotech | Quality Management System</title>

    <!-- Google Fonts: Outfit, Inter, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Google Identity Services SDK for Google Drive Integration -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
      // Giải pháp khẩn cấp gỡ bỏ Service Worker cũ của PWA tránh kẹt cache trên shared host
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister().then(function(success) {
              if (success) console.log('Đã giải phóng Service Worker cũ thành công.');
            });
          }
        }).catch(function(err) {
          console.warn('Lỗi khi quét Service Worker:', err);
        });
      }
    </script>

    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f5f5f7;
            color: #1d1d1f; 
            -webkit-font-smoothing: antialiased;
        }
        .dark body {
            background-color: #000000;
            color: #f5f5f7;
        }
        #app-loader {
            position: fixed; inset: 0; background: #fbfbfd;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 99999;
        }
        .dark #app-loader {
            background: #000000;
        }
        .loader-spinner {
            width: 32px; height: 32px; border: 2px solid #e5e5e7;
            border-top: 2px solid #1d1d1f; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .dark .loader-spinner {
            border: 2px solid #1c1c1e;
            border-top: 2px solid #ffffff;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #3a3a3c; }
    </style>
</head>
<body>
    <div id="app-loader">
        <div class="loader-spinner"></div>
        <p style="margin-top: 16px; font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; font-size: 11px; color: #86868b; text-transform: uppercase; letter-spacing: 2px;">V-Biotech Systems</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
