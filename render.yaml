services:
  - type: web
    name: v-biotech-authority
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FIREBASE_PROJECT_ID
        value: v-biotech
      - key: FIREBASE_DATABASE_URL
        value: https://v-biotech-default-rtdb.asia-southeast1.firebasedatabase.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://v-biotech.web.app,https://v-biotech.firebaseapp.com
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
