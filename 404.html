<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Biotech | Quality Management System</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.
      var pathSegmentsToKeep = 1; // 1 segment for project repo (e.g. /PQM/)

      var l = window.location;
      var pathParts = l.pathname.split('/').filter(Boolean);
      // If deployed on custom domain (root), keep 0, otherwise keep 1
      var isSubpath = pathParts.length > 0 && pathParts[0].toLowerCase() === 'pqm';
      var keep = isSubpath ? 1 : 0;

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (keep === 1 ? '/' + pathParts[0] : '') + '/?/' +
        l.pathname.slice(1).split('/').slice(keep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
